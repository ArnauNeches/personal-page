<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="src/assets/images/favicon.png">
    <link rel="stylesheet" href="src/styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Books</title>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1 class="header-title">Readings list</h1>
            <p class="header-text">I started reading when I began University in 2022</p>
            <nav class="header-nav">
                <div class="nav-link"><a href="#read-books">Read books</a></div>
                <div class="nav-link"><a href="#suggestions">Suggestions</a></div>
                <div class="nav-link"><a href="index.html">Main page</a></div>
            </nav>
        </div>

    </header>
    <main class="site-main">
        <div class="container">
            <section class="main-section" id="read-books">
                <h2 class="section-title">Read books</h2>
                <div class="books-container">
                    <h3>2022</h3>
                    <div class="book">b1</div>
                    <div class="book">b2</div>
                </div>
                <div class="books-container">
                    <h3>2023</h3>
                    <div class="book">b1</div>
                    <div class="book">b2</div>
                </div>
                <div class="books-container">
                    <h3>2024</h3>
                    <div class="book">b1</div>
                    <div class="book">b2</div>
                </div>
            </section>

            <section class="main-section" id="suggestions">
                <h2 class="section-title">Suggestions! </h2>
                <p>Feel free to suggest books I should read</p>
                <form class="books-form" action="#" method="post">
                    <label class="books-form-label" for="title">Title:</label>
                    <input class="books-form-input" id="title" type="text" name="title">
                    <br>
                    <label class="books-form-label" for="author">Author:</label>
                    <input class="books-form-input" id="author" type="text" name="author">
                    <br>
                    <label class="books-form-label" for="description">Description</label>
                    <textarea class="books-form-textarea" name="description"
                        id="description">Brief description that you think I would like</textarea>
                    <br>
                    <input type="submit">
                </form>
            </section>
        </div>

    </main>
    <footer class="site-footer">
        <div class="container">
            <div class="contact-links">
                <div class="contact-link"> <a href="mailto:arnichi2103@gmail.com"><i
                            class="fa-solid fa-envelope"></i>arnichi2103@gmail.com</a> </div>
                <div class="contact-link"> <a href="https://github.com/ArnauNeches"><i
                            class="fa-brands fa-github"></i>GitHub</a> </div>
                <div class="contact-link"> <a href="https://www.linkedin.com/in/arnau-neches-vil%C3%A0-096627255/"><i
                            class="fa-brands fa-linkedin"></i>Linkedln</a> </div>
            </div>
        </div>

    </footer>

</body>

</html>
