    <link rel="stylesheet" href="src/styles/styles.css">
    <title>Books</title>
</head>

<body>
    <header class="site-header">
        <h1 class="header-title">Readings list</h1>
        <p class="header-text">I started reading when I began University in 2022</p>
        <nav class="header-nav">
            <div class="nav-link"><a href="#read-books">Read books</a></div>
            <div class="nav-link"><a href="#suggestions">Suggestions</a></div>
            <div class="nav-link"><a href="index.html">Main page</a></div>
        </nav>
    </header>
    <main class="site-main">
        <section class="main-section" id="read-books">
            <h2>Read books</h2>
            <div class="books-container">
                <h3>2022</h3>
                <div class="book">b1</div>
                <div class="book">b2</div>
            </div>
            <div class="books-container">
                <h3>2023</h3>
                <div class="book">b1</div>
                <div class="book">b2</div>
            </div>
            <div class="books-container">
                <h3>2024</h3>
                <div class="book">b1</div>
                <div class="book">b2</div>
            </div>
        </section>

        <section class="main-section" id="suggestions">
            <h2>Suggestions! </h2>
            <p>Feel free to suggest books I should read</p>
            <form class="books-form" action="#" method="post">
                <label class="books-form-label" for="title">Title:</label>
                <input class="books-form-input" id="title" type="text" name="title">
                <br>
                <label class="books-form-label" for="author">Author:</label>
                <input class="books-form-input" id="author" type="text" name="author">
                <br>
                <label class="books-form-label" for="description">Description</label>
                <textarea class="books-form-textarea" name="description" id="description">Brief description that you think I would like</textarea>
                <br>
                <input type="submit">
            </form>
        </section>
    </main>
